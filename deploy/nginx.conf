server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/feed/ {
    proxy_pass https://www.reddit.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.reddit.com;
    proxy_set_header User-Agent "HorizontAlmanach/1.0";
    proxy_read_timeout 20s;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
