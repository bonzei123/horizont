server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/adsb/ {
    proxy_pass https://api.adsb.lol/;
    proxy_ssl_server_name on;
    proxy_set_header Host api.adsb.lol;
    proxy_read_timeout 15s;
  }

  location = /api/tle/visual {
    proxy_pass https://celestrak.org/NORAD/elements/gp.php?GROUP=visual&FORMAT=3le;
    proxy_ssl_server_name on;
    proxy_set_header Host celestrak.org;
    proxy_read_timeout 25s;
  }

  location /api/feed/ {
    proxy_pass https://www.reddit.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.reddit.com;
    proxy_set_header User-Agent "HorizontAlmanach/1.0";
    proxy_read_timeout 20s;
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/manifest+json;
}
